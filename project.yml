name: Keyline
options:
  bundleIdPrefix: com.alexsuarez
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Keyline:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Keyline.entitlements
          - Resources/Assets.xcassets
      - path: Sources/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.keyline
        PRODUCT_NAME: Keyline
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Keyline.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Keyline
        CFBundleDisplayName: Keyline
        CFBundleIdentifier: com.nightmoose.keyline
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "Copyright © Keyline"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Adobe Illustrator Artwork
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.illustrator.ai-image
            CFBundleTypeExtensions:
              - ai
              - ait
          - CFBundleTypeName: Adobe Photoshop Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.photoshop-image
            CFBundleTypeExtensions:
              - psd
          - CFBundleTypeName: Adobe Photoshop Large Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.photoshop-large-image
            CFBundleTypeExtensions:
              - psb
          - CFBundleTypeName: Encapsulated PostScript
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.encapsulated-postscript
              - com.adobe.photoshop-eps-image
            CFBundleTypeExtensions:
              - eps
              - epsf
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
            CFBundleTypeExtensions:
              - pdf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.adobe.illustrator.ai-image
            UTTypeDescription: Adobe Illustrator Artwork
            UTTypeConformsTo:
              - public.data
              - public.image
              - com.adobe.pdf
            UTTypeTagSpecification:
              public.filename-extension:
                - ai
                - ait
              public.mime-type:
                - application/vnd.adobe.illustrator
                - application/postscript
          - UTTypeIdentifier: com.adobe.photoshop-image
            UTTypeDescription: Adobe Photoshop Document
            UTTypeConformsTo:
              - public.image
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - psd
              public.mime-type:
                - image/vnd.adobe.photoshop
                - application/x-photoshop
          - UTTypeIdentifier: com.adobe.photoshop-large-image
            UTTypeDescription: Adobe Photoshop Large Document
            UTTypeConformsTo:
              - public.image
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - psb
              public.mime-type:
                - image/vnd.adobe.photoshop
  KeylineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Keyline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightmoose.keyline.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keyline.app/Contents/MacOS/Keyline"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Keyline:
    build:
      targets:
        Keyline: all
        KeylineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeylineTests
